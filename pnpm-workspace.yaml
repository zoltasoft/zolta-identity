packages:
  - layers/auth
  - layers/admin
  - packages/i18n
  - packages/ui

allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  esbuild: true
  unrs-resolver: true
  vue-demi: true

minimumReleaseAgeExclude:
  - ws@8.20.1 || 8.21.0
  - brace-expansion@5.0.6 || 5.0.7 || 5.0.8 || 5.0.9
  - esbuild@0.28.1
  - postcss@8.5.18 || 8.5.23
  - socket.io-parser@4.2.7
  - undici@6.28.0
  - js-yaml@4.3.1
  - nanoid@3.3.16 || 3.3.18

overrides:
  '@bomb.sh/tab@<0.0.22': ^0.0.22
  '@tiptap/core': 3.30.4
  '@tiptap/suggestion': 3.22.4
  esbuild@>=0.27.3 <0.28.1: ^0.28.1
  js-yaml@>=4.0.0 <4.3.1: ^4.3.1
  socket.io-parser@>=4.0.0 <4.2.7: ^4.2.7
  undici@<6.28.0: ^6.28.0
  ws@>=8.0.0 <8.20.1: ^8.20.1
  ws@>=8.0.0 <8.21.0: ^8.21.0
